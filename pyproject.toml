[project]
name = "sunwai"
version = "0.1.0"
description = "Campus grievance swarm: students, staff and Meko-powered agents resolving complaints together."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [{ name = "Team Syzygy (Atharv, Alok, Arun)" }]
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "mcp>=1.9",
    "openai>=1.40",
    "pydantic>=2.7",
    "python-dotenv>=1.0",
    "httpx>=0.27",
]

[project.scripts]
sunwai = "sunwai.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["sunwai"]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]
